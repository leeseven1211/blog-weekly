<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#0f172a"/>
  <text x="110" y="150" fill="#93c5fd" font-size="44" font-family="Arial, PingFang SC, Microsoft YaHei">本周一图</text>
  <text x="110" y="235" fill="#ffffff" font-size="84" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei">AI 供给链的五层栈</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei" font-size="42" fill="#ffffff">
    <rect x="200" y="650" width="1200" height="110" rx="24" fill="#1d4ed8"/><text x="740" y="720" text-anchor="middle">默认入口：Slack、IDE、办公套件、搜索框</text>
    <rect x="260" y="530" width="1080" height="100" rx="24" fill="#2563eb"/><text x="800" y="595" text-anchor="middle">工作流：共享 agent、审批、回滚、审计</text>
    <rect x="320" y="420" width="960" height="90" rx="24" fill="#0ea5e9"/><text x="800" y="478" text-anchor="middle">云与平台：数据中心、调度、开发者工具</text>
    <rect x="380" y="320" width="840" height="80" rx="24" fill="#10b981"/><text x="800" y="372" text-anchor="middle">芯片：GPU、ASIC、国产替代</text>
    <rect x="440" y="230" width="720" height="70" rx="24" fill="#f59e0b"/><text x="800" y="276" text-anchor="middle">电力与土地：容量、并网、建设周期</text>
  </g>
  <text x="110" y="830" fill="#cbd5e1" font-size="36" font-family="Arial, PingFang SC, Microsoft YaHei">同一家公司越能往下吃到更多层，越有机会把上面的服务做成默认选项。</text>
</svg>